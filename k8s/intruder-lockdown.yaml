apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intruder-lockdown
spec:
  podSelector:
    matchLabels:
      app: intruder
  policyTypes:
  - Egress
  egress:
  # ONLY allow outbound traffic to the secure-target pod
  - to:
    - podSelector:
        matchLabels:
          app: secure-target