apiVersion: v1
kind: Pod
metadata:
  name: secure-target
  labels:
    app: secure-target
spec:
  containers:
  # The Target Application
  - name: target-app
    image: nginx:alpine
    ports:
    - containerPort: 80
    resources:
      requests:
        cpu: "100m"      # Guarantees 1/10th of a CPU core
        memory: "128Mi"
      limits:
        cpu: "250m"      # Hard cap to prevent CPU exhaustion during floods
        memory: "256Mi"
  
  # IDS Feature Extractor Sidecar
  - name: ids-sensor-sidecar
    image: YOUR-ACR-NAME/ids-sensor:v1
    securityContext:
      capabilities:
        add: ["NET_RAW", "NET_ADMIN"]
    resources:
      requests:
        cpu: "250m"      # The sensor needs slightly more baseline power for packet sniffing
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"